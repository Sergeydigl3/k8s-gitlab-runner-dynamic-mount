---
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingWebhookConfiguration
metadata:
  name: gitlab-pvc-injector
webhooks:
  - name: pvc-injector.gitlab-hooks.svc
    sideEffects: None
    admissionReviewVersions: ["v1"]
    clientConfig:
      service:
        name: pvc-injector
        namespace: gitlab-hooks
        path: "/mutate"
      caBundle: 
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: gitlab-runner
    matchConditions:
      - name: "include-only-pods-with-share-env"
        expression: "object.spec.containers.exists(c, has(c.env) && c.env.exists(e, e.name == 'SHARE_CLAIM_NAME'))"
    rules:
      - operations: ["CREATE"]
        apiGroups: [""]
        apiVersions: ["v1"]
        resources: ["pods"]
    failurePolicy: Ignore
